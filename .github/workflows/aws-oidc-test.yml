name: AWS OIDC Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-oidc-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2

      - name: Verify temporary AWS identity
        run: aws sts get-caller-identity
