name: Publish Phase 4 Model Insights

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Write reconciled aggregate model artifacts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUCKET: black-outcomes-intelligence-dev-4623dd8370ffd332f292468c61
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2
      - name: Download authoritative source and Silver stages
        run: |
          set -euo pipefail
          mkdir -p /tmp/gold-model /tmp/published-model
          for year in 2022 2023 2024; do
            aws s3 cp "s3://$BUCKET/bronze/acs_pums/year=$year/release=1-year/csv_pus.zip" "/tmp/source-$year.zip"
            aws s3 cp "s3://$BUCKET/silver/acs_pums_person/year=$year/data/part-00000.parquet" "/tmp/silver-$year.parquet"
          done
      - name: Build aggregate year-held-out model artifacts
        run: |
          python -m src.transform.build_models \
            --silver 2022=/tmp/silver-2022.parquet \
            --silver 2023=/tmp/silver-2023.parquet \
            --silver 2024=/tmp/silver-2024.parquet \
            --output-dir /tmp/gold-model
          python -m src.transform.publish_dashboard \
            --gold-dir /tmp/gold-model --output-dir /tmp/published-model --modeling
      - name: Enforce source-to-model-to-publication reconciliation
        run: |
          python -m src.transform.reconcile_models \
            --source 2022=/tmp/source-2022.zip --source 2023=/tmp/source-2023.zip --source 2024=/tmp/source-2024.zip \
            --silver 2022=/tmp/silver-2022.parquet --silver 2023=/tmp/silver-2023.parquet --silver 2024=/tmp/silver-2024.parquet \
            --gold-dir /tmp/gold-model --published-dir /tmp/published-model \
            --report /tmp/model-reconciliation.json
          cat /tmp/model-reconciliation.json
      - name: Retain reconciled aggregate evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-model-review-${{ github.run_id }}
          path: |
            /tmp/published-model/model_metrics.csv
            /tmp/published-model/model_calibration.csv
            /tmp/published-model/model_card.json
            /tmp/model-reconciliation.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish aggregate artifacts only after reconciliation
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          for name in model_metrics.csv model_calibration.csv model_card.json; do
            aws s3 cp "/tmp/gold-model/$name" "s3://$BUCKET/gold/model_insights/years=2022-2024/$name"
            aws s3 cp "/tmp/published-model/$name" "s3://$BUCKET/published/model_insights/years=2022-2024/$name"
          done
      - name: Verify published objects byte-for-byte
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          for name in model_metrics.csv model_calibration.csv model_card.json; do
            aws s3 cp "s3://$BUCKET/published/model_insights/years=2022-2024/$name" "/tmp/verify-$name"
            cmp "/tmp/published-model/$name" "/tmp/verify-$name"
          done
      - name: Record dry-run result
        if: ${{ !inputs.publish }}
        run: echo "Phase 4 reconciliation passed; aggregate review evidence was retained, and no Gold or published S3 objects were written."
