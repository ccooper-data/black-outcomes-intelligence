name: Snapshot Phase 4 Model Insights

on: workflow_dispatch

permissions:
  contents: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    env:
      BUCKET: black-outcomes-intelligence-dev-4623dd8370ffd332f292468c61
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2
      - name: Copy aggregate model artifacts
        run: |
          set -euo pipefail
          mkdir -p data/published
          for name in model_metrics.csv model_calibration.csv model_card.json; do
            aws s3 cp "s3://$BUCKET/published/model_insights/years=2022-2024/$name" "data/published/$name"
          done
      - name: Verify aggregate-only suppression-safe contract
        run: |
          python - <<'PY'
          import csv
          import json

          def read_rows(path):
              with open(path, newline='') as handle:
                  return list(csv.DictReader(handle))

          metrics = read_rows('data/published/model_metrics.csv')
          calibration = read_rows('data/published/model_calibration.csv')
          with open('data/published/model_card.json') as handle:
              card = json.load(handle)
          assert {row['model'] for row in metrics} == {'weighted_prevalence_baseline', 'survey_weighted_logistic'}
          assert {int(row['evaluation_year']) for row in metrics} == {2024}
          assert {row['metric'] for row in metrics} == {'brier_score', 'log_loss'}
          assert len(calibration) >= 2
          assert card['person_level_predictions_published'] is False
          for rows in (metrics, calibration):
              columns = set(rows[0])
              for flag in [column for column in columns if column.endswith('_is_suppressed')]:
                  prefix = flag.removesuffix('_is_suppressed')
                  for row in rows:
                      if row[flag].strip().lower() == 'true':
                          for field in ('estimate','standard_error','ci95_lower','ci95_upper','relative_standard_error'):
                              column = f'{prefix}_{field}'
                              if column in columns:
                                  assert row[column].strip() == ''
          PY
      - name: Commit dashboard snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/published/model_metrics.csv data/published/model_calibration.csv data/published/model_card.json
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot Phase 4 aggregate model insights"
          git push
