name: Terraform AWS

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply a freshly generated plan to AWS (main only)"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  id-token: write
  contents: read

# Serialize all state operations; never cancel an in-flight plan or apply.
concurrency:
  group: terraform-aws-state
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # Pushes to main only plan (drift visibility). Apply requires an explicit
      # manual dispatch with apply=true, and always generates its own fresh plan above.
      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' }}
        run: terraform apply -input=false -auto-approve tfplan
