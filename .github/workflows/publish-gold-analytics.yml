name: Publish Gold Analytics

on:
  workflow_dispatch:
    inputs:
      year:
        description: "ACS PUMS year"
        required: true
        default: "2024"
        type: string
      publish:
        description: "Write reconciled artifacts to the published prefix"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: black-outcomes-intelligence-dev-4623dd8370ffd332f292468c61
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2
      - name: Download authoritative pipeline stages independently
        if: ${{ inputs.year != '2022-2024' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gold /tmp/published
          aws s3 cp "s3://$BUCKET/bronze/acs_pums/year=${{ inputs.year }}/release=1-year/csv_pus.zip" /tmp/source.zip
          aws s3 cp "s3://$BUCKET/silver/acs_pums_person/year=${{ inputs.year }}/data/part-00000.parquet" /tmp/silver.parquet
          for name in national.csv states.csv intersectional.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/gold/black_outcomes/year=${{ inputs.year }}/$name" "/tmp/gold/$name"
          done
      - name: Build candidate dashboard artifacts
        if: ${{ inputs.year != '2022-2024' }}
        run: python -m src.transform.publish_dashboard --gold-dir /tmp/gold --output-dir /tmp/published
      - name: Enforce full source-to-dashboard reconciliation
        if: ${{ inputs.year != '2022-2024' }}
        run: |
          python -m src.transform.reconcile \
            --source /tmp/source.zip \
            --silver /tmp/silver.parquet \
            --gold-dir /tmp/gold \
            --published-dir /tmp/published \
            --year "${{ inputs.year }}" \
            --report /tmp/reconciliation-report.json
          cat /tmp/reconciliation-report.json
      - name: Publish only after reconciliation passes
        if: ${{ inputs.publish && inputs.year != '2022-2024' }}
        run: |
          set -euo pipefail
          for name in national.csv states.csv intersectional.csv manifest.json; do
            aws s3 cp "/tmp/published/$name" "s3://$BUCKET/published/year=${{ inputs.year }}/$name"
          done
      - name: Verify published objects are byte-identical to reconciled candidates
        if: ${{ inputs.publish && inputs.year != '2022-2024' }}
        run: |
          set -euo pipefail
          for name in national.csv states.csv intersectional.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/published/year=${{ inputs.year }}/$name" "/tmp/verify-$name"
            cmp "/tmp/published/$name" "/tmp/verify-$name"
          done
      - name: Download longitudinal pipeline stages independently
        if: ${{ inputs.year == '2022-2024' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gold /tmp/published
          for year in 2022 2023 2024; do
            aws s3 cp "s3://$BUCKET/bronze/acs_pums/year=$year/release=1-year/csv_pus.zip" "/tmp/source-$year.zip"
            aws s3 cp "s3://$BUCKET/silver/acs_pums_person/year=$year/data/part-00000.parquet" "/tmp/silver-$year.parquet"
          done
          for name in trends.csv contrasts.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/gold/black_outcomes_longitudinal/years=2022-2024/$name" "/tmp/gold/$name"
          done
      - name: Build and reconcile longitudinal candidates
        if: ${{ inputs.year == '2022-2024' }}
        run: |
          python -m src.transform.publish_dashboard --gold-dir /tmp/gold --output-dir /tmp/published --longitudinal
          python -m src.transform.reconcile_longitudinal \
            --source 2022=/tmp/source-2022.zip --source 2023=/tmp/source-2023.zip --source 2024=/tmp/source-2024.zip \
            --silver 2022=/tmp/silver-2022.parquet --silver 2023=/tmp/silver-2023.parquet --silver 2024=/tmp/silver-2024.parquet \
            --gold-dir /tmp/gold --published-dir /tmp/published --report /tmp/reconciliation-report.json
          cat /tmp/reconciliation-report.json
      - name: Publish longitudinal only after reconciliation passes
        if: ${{ inputs.publish && inputs.year == '2022-2024' }}
        run: |
          set -euo pipefail
          for name in trends.csv contrasts.csv manifest.json; do
            aws s3 cp "/tmp/published/$name" "s3://$BUCKET/published/longitudinal/years=2022-2024/$name"
          done
      - name: Verify longitudinal objects are byte-identical
        if: ${{ inputs.publish && inputs.year == '2022-2024' }}
        run: |
          set -euo pipefail
          for name in trends.csv contrasts.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/published/longitudinal/years=2022-2024/$name" "/tmp/verify-$name"
            cmp "/tmp/published/$name" "/tmp/verify-$name"
          done
      - name: Record dry-run result
        if: ${{ !inputs.publish }}
        run: echo "Reconciliation passed in dry-run mode; no published objects were written."
