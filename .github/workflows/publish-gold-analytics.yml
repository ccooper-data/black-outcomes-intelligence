name: Publish Gold Analytics

on:
  workflow_dispatch:
    inputs:
      year:
        description: "ACS PUMS year"
        required: true
        default: "2024"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: black-outcomes-intelligence-dev-4623dd8370ffd332f292468c61
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2
      - name: Publish exact validated Gold artifacts
        run: |
          set -euo pipefail
          for name in national.csv states.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/gold/black_outcomes/year=${{ inputs.year }}/$name" "/tmp/$name"
            aws s3 cp "/tmp/$name" "s3://$BUCKET/published/year=${{ inputs.year }}/$name"
            aws s3 cp "s3://$BUCKET/published/year=${{ inputs.year }}/$name" "/tmp/published-$name"
            cmp "/tmp/$name" "/tmp/published-$name"
          done
      - name: Emit reconciliation evidence
        run: |
          sha256sum /tmp/national.csv /tmp/published-national.csv
          sha256sum /tmp/states.csv /tmp/published-states.csv
