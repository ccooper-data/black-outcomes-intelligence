name: Publish Gold Analytics

on:
  workflow_dispatch:
    inputs:
      year:
        description: "ACS PUMS year"
        required: true
        default: "2024"
        type: string
      publish:
        description: "Write reconciled artifacts to the published prefix"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: black-outcomes-intelligence-dev-4623dd8370ffd332f292468c61
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2
      - name: Download authoritative pipeline stages independently
        run: |
          set -euo pipefail
          mkdir -p /tmp/gold /tmp/published
          aws s3 cp "s3://$BUCKET/bronze/acs_pums/year=${{ inputs.year }}/release=1-year/csv_pus.zip" /tmp/source.zip
          aws s3 cp "s3://$BUCKET/silver/acs_pums_person/year=${{ inputs.year }}/data/part-00000.parquet" /tmp/silver.parquet
          for name in national.csv states.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/gold/black_outcomes/year=${{ inputs.year }}/$name" "/tmp/gold/$name"
          done
      - name: Build candidate dashboard artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          source = Path('/tmp/gold')
          target = Path('/tmp/published')
          for name in ('national.csv', 'states.csv'):
              pd.read_csv(source / name).to_csv(target / name, index=False)
          (target / 'manifest.json').write_bytes((source / 'manifest.json').read_bytes())
          PY
      - name: Enforce full source-to-dashboard reconciliation
        run: |
          python -m src.transform.reconcile \
            --source /tmp/source.zip \
            --silver /tmp/silver.parquet \
            --gold-dir /tmp/gold \
            --published-dir /tmp/published \
            --year "${{ inputs.year }}" \
            --report /tmp/reconciliation-report.json
          cat /tmp/reconciliation-report.json
      - name: Publish only after reconciliation passes
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          for name in national.csv states.csv manifest.json; do
            aws s3 cp "/tmp/published/$name" "s3://$BUCKET/published/year=${{ inputs.year }}/$name"
          done
      - name: Verify published objects are byte-identical to reconciled candidates
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          for name in national.csv states.csv manifest.json; do
            aws s3 cp "s3://$BUCKET/published/year=${{ inputs.year }}/$name" "/tmp/verify-$name"
            cmp "/tmp/published/$name" "/tmp/verify-$name"
          done
      - name: Record dry-run result
        if: ${{ !inputs.publish }}
        run: echo "Reconciliation passed in dry-run mode; no published objects were written."
