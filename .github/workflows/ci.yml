name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify no production point-estimate-only SQL remains
        run: '! grep -R --exclude=ci.yml "CREATE TABLE gold_black_outcomes" .github/workflows'
      - name: Prevent destructive Gold-prefix synchronization
        run: '! grep -R --exclude=ci.yml -q "aws s3 sync" .github/workflows'
      - name: Verify publication reconciliation is enforced
        run: |
          grep -q "python -m src.transform.reconcile" .github/workflows/publish-gold-analytics.yml
          grep -q -- "--source /tmp/source.zip" .github/workflows/publish-gold-analytics.yml
          grep -q -- "--silver /tmp/silver.parquet" .github/workflows/publish-gold-analytics.yml
          grep -q 'cmp "/tmp/published/$name"' .github/workflows/publish-gold-analytics.yml
          grep -q 'default: false' .github/workflows/publish-gold-analytics.yml
          grep -q 'if:.*inputs.publish' .github/workflows/publish-gold-analytics.yml
          grep -q "python -m src.transform.reconcile_longitudinal" .github/workflows/publish-gold-analytics.yml
          grep -q 'published/longitudinal/years=2022-2024' .github/workflows/publish-gold-analytics.yml
      - name: Verify Phase 4 publication safeguards
        run: |
          grep -q "python -m src.transform.reconcile_models" .github/workflows/publish-model-insights.yml
          grep -q 'default: false' .github/workflows/publish-model-insights.yml
          grep -q 'if:.*inputs.publish' .github/workflows/publish-model-insights.yml
          grep -q 'cmp "/tmp/published-model/$name"' .github/workflows/publish-model-insights.yml
          grep -q 'actions/upload-artifact@v4' .github/workflows/publish-model-insights.yml
          grep -q '/tmp/published-model/model_metrics.csv' .github/workflows/publish-model-insights.yml
          ! grep -q 'import pandas' .github/workflows/snapshot-model-insights.yml
          ! grep -R --exclude=ci.yml -q 'person_predictions.csv' .github src
