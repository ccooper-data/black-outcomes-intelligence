name: Snapshot Dashboard Data

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Published analytics year"
        required: true
        default: "2024"
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780976819607:role/black-outcomes-github-deploy
          aws-region: us-east-2
      - name: Copy aggregated dashboard extracts
        env:
          BUCKET: black-outcomes-intelligence-dev-4623dd8370ffd332f292468c61
        run: |
          set -euo pipefail
          mkdir -p data/published
          aws s3 cp "s3://$BUCKET/published/year=${{ inputs.year }}/national.csv" data/published/national.csv
          aws s3 cp "s3://$BUCKET/published/year=${{ inputs.year }}/states.csv" data/published/states.csv
          aws s3 cp "s3://$BUCKET/published/year=${{ inputs.year }}/intersectional.csv" data/published/intersectional.csv
          test "$(tail -n +2 data/published/national.csv | wc -l)" -eq 1
          test "$(tail -n +2 data/published/states.csv | wc -l)" -eq 51
          test "$(tail -n +2 data/published/intersectional.csv | wc -l)" -eq 728
      - name: Validate Phase 1 statistical contract
        run: |
          pip install pandas
          python - <<'PY'
          import pandas as pd
          for p in ('data/published/national.csv', 'data/published/states.csv', 'data/published/intersectional.csv'):
              d = pd.read_csv(p)
              for metric in ('black_population', 'married_rate', 'bachelors_plus_rate', 'employment_rate', 'mean_personal_income'):
                  required = {f'{metric}_{x}' for x in ('estimate','standard_error','ci95_lower','ci95_upper','unweighted_n','weighted_denominator','is_suppressed','suppression_reason')}
                  assert required <= set(d), required - set(d)
          PY
      - name: Commit dashboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/national.csv data/published/states.csv data/published/intersectional.csv
          if git diff --cached --quiet; then
            echo "Dashboard data already current."
          else
            git commit -m "data: snapshot 2024 dashboard analytics"
            git push
          fi
